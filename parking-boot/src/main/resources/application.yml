# =============================================================================
# 智慧停车 SaaS 平台 — 通用配置（所有 Profile 共享）
# =============================================================================
# 敏感配置（密钥、商户号、回调地址等）禁止写入此文件。
# 生产环境所有敏感值通过环境变量注入，本地开发使用 application-local.yml。
# =============================================================================

spring:
  application:
    name: jushan-platform
  profiles:
    active: local

  # ---- Web MVC ----
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # ---- 数据源（默认 local 环境使用本地 MySQL，生产/测试由对应 profile 覆盖） ----
  datasource:
    url: jdbc:mysql://localhost:3306/jushan_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 10000

  # ---- Flyway 数据库迁移 ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  # ---- Redis（local 环境默认连接本地） ----
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# ---- 服务端口 ----
server:
  port: 8080

# ---- Actuator 健康检查与监控 ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.9,0.99

# ---- Device Access 客户端（T23） ----
# 生产环境通过环境变量覆盖：JUSHAN_DEVICE_ACCESS_BASE_URL / CONNECT_TIMEOUT / READ_TIMEOUT
jushan:
  device-access:
    base-url: http://localhost:8081
    connect-timeout: 3000
    read-timeout: 12000

# ---- Device Access Webhook 接收端配置 ----
# 生产环境通过环境变量覆盖：DEVICE_ACCESS_WEBHOOK_ALLOWED_IPS
device-access:
  webhook:
    # IP 白名单（逗号分隔），* 表示放行所有（仅限开发/测试环境）
    # 生产环境必须配置为 Device Access 服务的具体 IP 地址
    allowed-ips: "*"

# ---- JWT 配置 ----
# 生产环境必须通过环境变量 JWT_SECRET 覆盖，至少 32 字符
jwt:
  secret: ${JWT_SECRET:jushan-platform-secret-key-for-jwt-token-generation-must-be-at-least-32-chars}
  expiration: 86400000 # access token 有效期 24 小时（毫秒）
  refresh-expiration: 604800000 # refresh token 有效期 7 天（毫秒）

# ---- springdoc-openapi 文档 ----
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.jushan.platform.modules,com.jushan.system
  default-flat-param-object: true

# ---- 日志 ----
logging:
  level:
    root: INFO
    com.jushan: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
