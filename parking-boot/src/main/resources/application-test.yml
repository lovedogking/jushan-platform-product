# =============================================================================
# 智慧停车 SaaS 平台 — 测试配置
# =============================================================================
# 用于 mvn test 或 CI 环境。
# 集成测试通过 Testcontainers 启动真实 MySQL，无需外部依赖。
# =============================================================================

spring:

  # ---- 数据源：占位值（Testcontainers 通过 @ServiceConnection 动态注入真实连接） ----
  datasource:
    url: jdbc:mysql://localhost:3306/test_db?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: test
    password: test
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- Flyway ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  # ---- Redis：占位值（Testcontainers 通过 @ServiceConnection 动态注入） ----
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ---- RabbitMQ：测试默认禁用（需要 MQ 的测试通过 @TestPropertySource 启用） ----
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# ---- 平台内部 MQ 开关（测试默认关闭） ----
jushan:
  mq:
    rabbit:
      enabled: false

# ---- Sa-Token ----
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: tik
  is-log: false
  is-print: false

# ---- Actuator 测试模式 ----
management:
  endpoint:
    health:
      show-details: always

# ---- 测试日志 ----
logging:
  level:
    com.jushan: DEBUG
    org.springframework.test: INFO
    org.testcontainers: INFO
    com.github.dockerjava: WARN
