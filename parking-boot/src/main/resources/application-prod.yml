# =============================================================================
# 智慧停车 SaaS 平台 — 生产配置骨架
# =============================================================================
# 所有敏感值通过环境变量注入，不设置默认值 → 缺失时启动失败关闭。
# 非敏感值可在此文件设置合理默认值。
# =============================================================================
# 部署前必须设置的环境变量见项目根目录 .env.example。
# =============================================================================

# ---- 服务端口（可通过 SERVER_PORT 覆盖） ----
server:
  port: ${SERVER_PORT:8080}

spring:
  # ---- 数据源 ----
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 300000
      connection-timeout: 10000

  # ---- Flyway 数据库迁移 ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:8}
          max-idle: ${REDIS_POOL_MAX:8}
          min-idle: 0

  # ---- RabbitMQ ----
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

# ---- Actuator 生产安全模式 ----
management:
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# ---- springdoc-openapi 生产环境关闭 ----
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ---- Device Access Webhook 生产环境强制配置 ----
# 必须通过环境变量配置实际 IP 地址，禁止使用 *（全放行）
# DEVICE_ACCESS_WEBHOOK_ALLOWED_IPS  = Device Access 服务的 IP 地址（逗号分隔多个）
device-access:
  webhook:
    allowed-ips: ${DEVICE_ACCESS_WEBHOOK_ALLOWED_IPS:}
    signature-enabled: true

# ---- Device Access 客户端（T23, 生产环境） ----
jushan:
  device-access:
    base-url: ${JUSHAN_DEVICE_ACCESS_BASE_URL:http://127.0.0.1:8082}
    api-key: ${JUSHAN_DEVICE_ACCESS_API_KEY:}
    mock:
      enabled: false
    whitelist-sync-api-key: ${JUSHAN_WHITELIST_SYNC_API_KEY:}

# ---- 生产日志 ----
logging:
  level:
    root: WARN
    com.jushan: INFO
  # 生产环境建议使用文件追加器，由运维侧配置 logback-spring.xml

# ---- 微信小程序（prod 强制环境变量注入，不设置默认值） ----
wx:
  miniapp:
    appid: ${WX_MINIAPP_APPID}
    secret: ${WX_MINIAPP_SECRET}
    connect-timeout: 5000
    read-timeout: 10000
  mock-login: false
