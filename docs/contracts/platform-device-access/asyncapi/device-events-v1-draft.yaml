asyncapi: 2.6.0
info:
  title: Device Access Events (v1 draft)
  description: |
    Device Access → Platform 事件通道契约草案。
    主通道：RabbitMQ（推荐，NEEDS_HUMAN_DECISION 最终确认）。
    状态：DRAFT FOR JOINT REVIEW。所有事件为 PROPOSED。
    投递语义：至少一次；可能重复/延迟/乱序；Platform 用 eventId 幂等（Inbox）。
    若最终选 HTTP 回调为主通道，则本文件不作为主契约，改为 OpenAPI 回调契约（见 07-conflict-log C08）。

    **本文件中的 RabbitMQ 配置仅为草案提案，不代表生产已部署。所有 channel/topic/Routing Key 均为 PROPOSED。**
  version: 1.0.0-draft
  x-document-status: DRAFT_FOR_JOINT_REVIEW
  x-channel-decision-status: PROPOSED
  contact:
    name: Platform & Device Access Joint Review

servers:
  production:
    url: amqp://device-access.internal:5672/device-access
    protocol: amqp
    description: 生产 RabbitMQ vhost /device-access（PROPOSED，待确认部署细节）
  dev:
    url: amqp://127.0.0.1:5672/device-access
    protocol: amqp
    description: 联调（PROPOSED）

defaultContentType: application/json

channels:
  device.events.v1:
    description: |
      Device Access 事件主 Exchange（topic，durable，autoDelete=false）。
      **PROPOSED。** 此配置为草案提案，双方确认前不得假设已部署。Channel 名称和 Routing Key 均为推荐方案。
    publish:
      operationId: publishDeviceEvent
      message:
        oneOf:
          - $ref: '#/components/messages/PlateRecognized'
          - $ref: '#/components/messages/DeviceOnline'
          - $ref: '#/components/messages/DeviceOffline'
          - $ref: '#/components/messages/DeviceHeartbeat'
          - $ref: '#/components/messages/GateStatusChanged'
          - $ref: '#/components/messages/DeviceAlarm'
          - $ref: '#/components/messages/CommandResult'
          - $ref: '#/components/messages/ImageUploaded'
          - $ref: '#/components/messages/DeviceConfigApplied'

components:
  messages:
    PlateRecognized:
      name: PLATE_RECOGNIZED
      title: 车牌识别事件
      summary: 摄像头识别到车牌，DA 转换后上报。
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    DeviceOnline:
      name: DEVICE_ONLINE
      title: 设备上线
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    DeviceOffline:
      name: DEVICE_OFFLINE
      title: 设备离线
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    DeviceHeartbeat:
      name: DEVICE_HEARTBEAT
      title: 设备心跳（限流）
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    GateStatusChanged:
      name: GATE_STATUS_CHANGED
      title: 道闸状态变更
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    DeviceAlarm:
      name: DEVICE_ALARM
      title: 设备告警
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    CommandResult:
      name: COMMAND_RESULT
      title: 命令执行结果
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    ImageUploaded:
      name: IMAGE_UPLOADED
      title: 图片补传完成
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    DeviceConfigApplied:
      name: DEVICE_CONFIG_APPLIED
      title: 配置应用结果
      payload:
        $ref: '#/components/schemas/EventEnvelope'

  schemas:
    EventEnvelope:
      type: object
      required: [eventId, eventType, protocolVersion, schemaVersion, tenantId, parkingLotId, platformDeviceId, deviceSn, vendor, occurredAt, receivedAt, traceId, payload]
      properties:
        eventId:
          type: string
          description: 事件唯一标识，Platform Inbox 幂等键
        eventType:
          type: string
          enum: [PLATE_RECOGNIZED, DEVICE_ONLINE, DEVICE_OFFLINE, DEVICE_HEARTBEAT, GATE_STATUS_CHANGED, DEVICE_ALARM, COMMAND_RESULT, IMAGE_UPLOADED, DEVICE_CONFIG_APPLIED]
        protocolVersion:
          type: string
          example: "1.0"
        schemaVersion:
          type: string
          example: "1.0.0"
        tenantId:
          type: string
        parkingLotId:
          type: string
        laneId:
          type: string
        platformDeviceId:
          type: string
        deviceCode:
          type: string
        deviceSn:
          type: string
        deviceType:
          type: string
          enum: [CAMERA, GATE]
        vendor:
          type: string
          example: ZHENSHI
        vendorEventId:
          type: string
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        sequenceNo:
          type: integer
        offline:
          type: boolean
        traceId:
          type: string
        payload:
          type: object
        extensions:
          type: object
          description: ≤16KB，禁止放图片 Base64/密钥
