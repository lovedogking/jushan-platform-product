<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音播报测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="text"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        .voice-textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.3s;
        }
        .voice-textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-play {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-stop {
            background: #f44336;
            color: white;
        }
        .btn-stop:hover {
            background: #d32f2f;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }
        .result.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        .result.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .quick-btn {
            padding: 8px 15px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .quick-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>语音播报测试</h1>
        <p class="subtitle">设备: 917e2298-8ddf3e46 (ZhenShi-C5H)</p>

        <div class="form-group">
            <label for="deviceId">设备ID</label>
            <input type="text" id="deviceId" value="917e2298-8ddf3e46" placeholder="请输入设备ID">
        </div>

        <div class="form-group">
            <label for="apiKey">API Key</label>
            <input type="text" id="apiKey" value="test-key-123" placeholder="请输入API Key">
        </div>

        <div class="form-group">
            <label for="voiceText">播报内容</label>
            <textarea id="voiceText" class="voice-textarea" placeholder="请输入要播报的文本，例如：欢迎光临,请入场停车">欢迎光临</textarea>
            <div class="quick-buttons">
                <button class="quick-btn" onclick="setText('欢迎光临')">欢迎光临</button>
                <button class="quick-btn" onclick="setText('欢迎光临,请入场停车')">欢迎光临,请入场停车</button>
                <button class="quick-btn" onclick="setText('请交费 10.00 元')">请交费 10.00 元</button>
                <button class="quick-btn" onclick="setText('缴费成功')">缴费成功</button>
                <button class="quick-btn" onclick="setText('一路顺风')">一路顺风</button>
                <button class="quick-btn" onclick="setText('Welcome')">Welcome</button>
            </div>
        </div>

        <div class="form-group">
            <label for="opt">播放选项</label>
            <select id="opt">
                <option value="2">清除队列并播放 (opt=2)</option>
                <option value="1">添加到队列并播放 (opt=1)</option>
                <option value="0">添加到队列不播放 (opt=0)</option>
            </select>
        </div>

        <div class="button-group">
            <button class="btn-play" onclick="playVoice()">播放语音</button>
            <button class="btn-stop" onclick="stopVoice()">停止播放</button>
        </div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p style="margin-top: 10px; color: #666;">发送中...</p>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081/api/v1';

        function setText(text) {
            document.getElementById('voiceText').value = text;
        }

        function showResult(message, isSuccess) {
            const result = document.getElementById('result');
            result.textContent = message;
            result.className = 'result ' + (isSuccess ? 'success' : 'error');
            result.style.display = 'block';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        async function playVoice() {
            const deviceId = document.getElementById('deviceId').value;
            const apiKey = document.getElementById('apiKey').value;
            const voiceText = document.getElementById('voiceText').value;
            const opt = document.getElementById('opt').value;

            if (!deviceId || !voiceText) {
                showResult('请填写设备ID和播报内容', false);
                return;
            }

            showLoading(true);
            document.getElementById('result').style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/devices/${deviceId}/voice/control`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify({
                        action: 'PLAY',
                        voiceText: voiceText,
                        opt: parseInt(opt)
                    })
                });

                const data = await response.json();
                
                if (data.code === 200 && data.data && data.data.success) {
                    showResult(`播放成功！\n内容: ${voiceText}\n选项: opt=${opt}`, true);
                } else {
                    showResult(`播放失败: ${data.message || '未知错误'}`, false);
                }
            } catch (error) {
                console.error('详细错误:', error);
                showResult(`请求失败: ${error.message}\n请检查:\n1. 后端服务是否启动在 localhost:8081\n2. 浏览器控制台是否有 CORS 错误`, false);
            } finally {
                showLoading(false);
            }
        }

        async function stopVoice() {
            const deviceId = document.getElementById('deviceId').value;
            const apiKey = document.getElementById('apiKey').value;

            showLoading(true);
            document.getElementById('result').style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/devices/${deviceId}/voice/control`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify({
                        action: 'STOP'
                    })
                });

                const data = await response.json();
                
                if (data.code === 200 && data.data && data.data.success) {
                    showResult('停止播放成功！', true);
                } else {
                    showResult(`停止失败: ${data.message || '未知错误'}`, false);
                }
            } catch (error) {
                showResult(`请求失败: ${error.message}`, false);
            } finally {
                showLoading(false);
            }
        }

        // 支持回车键播放
        document.getElementById('voiceText').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                playVoice();
            }
        });
    </script>
</body>
</html>
