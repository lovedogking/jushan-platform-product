<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ParkSaaS - 智慧停车运营平台</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/theme-chalk/dark/css-vars.css">
<script src="https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.js"></script>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--card:#FFF;--primary:#2563EB;--primary-hover:#1D4ED8;--primary-light:#EFF6FF;--text:#0F172A;--text-sec:#475569;--text-muted:#94A3B8;--border:#E2E8F0;--success:#10B981;--success-bg:#DCFCE7;--warning:#F59E0B;--warning-bg:#FEF3C7;--danger:#EF4444;--danger-bg:#FEE2E2;--sidebar-bg:#0F172A;--el-color-primary:#2563EB;--el-color-primary-light-3:#5088F0;--el-color-primary-light-5:#7BA5F5;--el-color-primary-light-7:#A5C2F9;--el-color-primary-light-8:#BBD0FB;--el-color-primary-light-9:#D5E1FC;--el-color-primary-dark-2:#1D4ED8;--el-color-success:#10B981;--el-color-warning:#F59E0B;--el-color-danger:#EF4444;--el-border-radius-base:8px}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#app{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

/* SIDEBAR */
.aside{background:var(--sidebar-bg)!important;display:flex;flex-direction:column;border-right:none!important;overflow:hidden}
.sb-head{height:64px;display:flex;align-items:center;padding:0 20px;gap:10px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.sb-dot{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#2563EB,#3B82F6);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-dot i{color:#fff;font-size:18px}
.sb-brand{font-size:17px;font-weight:700;color:#F1F5F9;letter-spacing:-.02em}
.sb-scroll{flex:1;overflow-y:auto;padding:8px 0}
.sb-scroll::-webkit-scrollbar{width:0}
.sb-foot{padding:16px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
.sb-user:hover{background:rgba(255,255,255,.05)}
.sb-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2563EB,#06B6D4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;flex-shrink:0}
.sb-un{color:#E2E8F0;font-size:13px;font-weight:500}
.sb-ur{color:#64748B;font-size:11px}
.nav-gt{padding:16px 20px 8px;font-size:11px;font-weight:600;letter-spacing:.06em;color:#475569;text-transform:uppercase}

/* Menu overrides */
.sb-menu{border-right:none!important;background:transparent!important}
.sb-menu .el-menu-item,.sb-menu .el-sub-menu__title{height:42px;line-height:42px;margin:2px 12px;border-radius:8px;padding-left:12px!important}
.sb-menu .el-menu-item{color:rgba(255,255,255,.55)!important;font-size:13.5px}
.sb-menu .el-menu-item i{font-size:18px;margin-right:8px}
.sb-menu .el-menu-item:hover{background:rgba(255,255,255,.05)!important;color:rgba(255,255,255,.9)!important}
.sb-menu .el-menu-item.is-active{background:var(--primary)!important;color:#fff!important;position:relative}
.sb-menu .el-menu-item.is-active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:#fff;border-radius:0 3px 3px 0}

/* HEADER */
.hd{height:64px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;z-index:10}
.hd .el-breadcrumb{font-size:13px}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:8px}

/* LOGIN */
.login-bg{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0B1120,#1E293B 50%,#0F172A);position:relative;overflow:hidden}
.login-bg::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.12),transparent 70%);top:-200px;right:-100px}
.login-bg::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.08),transparent 70%);bottom:-100px;left:-100px}
.lc{background:#151E32;border-radius:20px;padding:48px 40px;width:420px;box-shadow:0 25px 60px -12px rgba(0,0,0,.5);position:relative;z-index:1;border:1px solid rgba(255,255,255,.05)}
.lc-logo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.lc-dot{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2563EB,#3B82F6);display:flex;align-items:center;justify-content:center}
.lc-dot i{font-size:20px;color:#fff}
.lc-title{font-size:22px;font-weight:700;color:#F1F5F9;letter-spacing:-.02em}
.lc-sub{color:#64748B;margin-bottom:32px;font-size:14px}
.lc .el-input__wrapper{background:#0F172A!important;box-shadow:0 0 0 1px #1E293B inset!important;border-radius:8px}
.lc .el-input__inner{color:#F1F5F9!important}
.lc .el-input__wrapper.is-focus{box-shadow:0 0 0 1px #2563EB inset,0 0 0 3px rgba(37,99,235,.15)!important}
.lc .el-form-item__label{color:#94A3B8!important;font-size:13px}
.lc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.lc-row .el-checkbox__label{color:#94A3B8;font-size:13px}

/* MAIN */
.main-c{background:var(--bg);overflow-y:auto;padding:24px}
.main-c::-webkit-scrollbar{width:6px}
.main-c::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.pg-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.pg-title{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.02em;margin:0}
.pg-desc{font-size:13px;color:var(--text-muted);margin-top:2px}

/* STATS */
.s4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.s4.c3{grid-template-columns:repeat(3,1fr)}
.sc{background:var(--card);border-radius:12px;padding:20px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:all .2s;border:1px solid transparent}
.sc:hover{box-shadow:0 10px 15px -3px rgba(0,0,0,.1);border-color:var(--border)}
.si{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.si.bl{background:var(--primary-light);color:var(--primary)}
.si.gn{background:var(--success-bg);color:var(--success)}
.si.am{background:var(--warning-bg);color:var(--warning)}
.si.rd{background:var(--danger-bg);color:var(--danger)}
.sv{font-size:28px;font-weight:700;color:var(--text);letter-spacing:-.02em;line-height:1.2}
.sl{font-size:12px;color:var(--text-muted);margin-top:2px}
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;margin-top:4px}
.st.up{color:var(--success)}
.st.dn{color:var(--danger)}

/* CHARTS */
.cg{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px}
.bc{display:flex;align-items:flex-end;gap:8px;height:180px;padding:16px 20px}
.bc .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bc .bar{width:100%;border-radius:4px 4px 0 0;transition:height .6s ease;min-height:4px}
.bc .bar.bl{background:linear-gradient(180deg,var(--primary),#60A5FA)}
.bc .bar.gn{background:linear-gradient(180deg,var(--success),#6EE7B7)}
.bc .lbl{font-size:11px;color:var(--text-muted)}
.donut-w{display:flex;align-items:center;justify-content:center;padding:20px;gap:24px}
.donut{width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--primary) 0% 35%,#60A5FA 35% 55%,var(--success) 55% 75%,var(--warning) 75% 88%,var(--text-muted) 88% 100%);position:relative}
.donut::after{content:'';position:absolute;inset:30px;background:var(--card);border-radius:50%}
.leg{display:flex;flex-direction:column;gap:10px}
.leg i{font-size:13px;color:var(--text-sec)}
.leg-d{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:inline-block;margin-right:8px}

/* CARDS */
.pc{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.pc .el-card__header{padding:16px 20px;border-bottom:1px solid var(--border)}
.pc .el-card__body{padding:20px}

/* SELECT CARDS */
.scs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scs.c4{grid-template-columns:repeat(4,1fr)}
.scc{padding:20px;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;text-align:center}
.scc:hover{border-color:#CBD5E1;background:var(--bg)}
.scc.on{border-color:var(--primary);background:var(--primary-light)}
.scc i{font-size:28px;margin-bottom:8px;display:block;color:var(--text-sec)}
.scc.on i{color:var(--primary)}
.scc .sl2{font-size:14px;font-weight:500;color:var(--text)}
.scc .sd2{font-size:12px;color:var(--text-muted);margin-top:4px}

/* GATE CARDS */
.gcg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gcc{padding:24px;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;text-align:center}
.gcc:hover,.gcc.on{border-color:var(--primary);background:var(--primary-light)}
.gcc i{font-size:32px;color:var(--primary);margin-bottom:8px;display:block}
.gcc .gn2{font-size:15px;font-weight:600;color:var(--text)}
.gcc .ga2{font-size:12px;color:var(--text-muted);margin-top:4px}

/* PARAM */
.ps-t{font-size:15px;font-weight:600;color:var(--text);padding-bottom:12px}
.pr{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.pr:last-child{border-bottom:none}
.pr-l{font-size:14px;color:var(--text)}
.pr-d{font-size:12px;color:var(--text-muted);margin-top:2px}

/* TABLE OVERRIDES */
.el-table{--el-table-border-color:var(--border)}
.el-table th.el-table__cell{background:var(--bg)!important;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--text-muted)!important}
.el-table td.el-table__cell{font-size:14px;color:var(--text-sec)}
.el-table .el-table__row:hover>td.el-table__cell{background:var(--bg)!important}
.el-pagination{margin-top:16px;justify-content:flex-end}
.el-dialog{border-radius:16px!important}
.el-dialog__header{border-bottom:1px solid var(--border);padding:16px 20px!important;margin-right:0}
.el-dialog__body{padding:20px!important}
.el-dialog__footer{border-top:1px solid var(--border);padding:12px 20px!important}
.info-box{padding:12px 16px;background:var(--primary-light);border-radius:8px;color:var(--primary);font-size:13px;margin-top:16px}
.info-box i{vertical-align:middle;margin-right:6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}

/* DARK */
html.dark{--bg:#0B1120;--card:#151E32;--text:#F1F5F9;--text-sec:#94A3B8;--text-muted:#64748B;--border:#1E293B;--primary-light:rgba(37,99,235,.15);--danger-bg:rgba(239,68,68,.15);--success-bg:rgba(16,185,129,.15);--warning-bg:rgba(245,158,11,.15)}
html.dark .sc,html.dark .pc{box-shadow:0 4px 6px -1px rgba(0,0,0,.3)}
html.dark .el-table th.el-table__cell{background:var(--card)!important}
html.dark .el-table .el-table__row:hover>td.el-table__cell{background:rgba(255,255,255,.02)!important}
html.dark .hd{background:var(--card);border-color:var(--border)}
html.dark .el-card{background:var(--card);--el-card-bg-color:var(--card)}
html.dark .el-table{--el-table-bg-color:var(--card);--el-table-tr-bg-color:var(--card);--el-table-header-bg-color:var(--card)}
html.dark .el-input__wrapper{background:var(--card)!important;box-shadow:0 0 0 1px var(--border) inset!important}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 6px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.dot-online{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--success);margin-right:6px;animation:pulse 2s infinite}
.dot-offline{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--danger);margin-right:6px}
</style>
</head>
<body>
<div id="app">

<!-- ====== LOGIN ====== -->
<div v-if="!logged" class="login-bg">
  <div class="lc">
    <div class="lc-logo">
      <div class="lc-dot"><i class="ri-roadster-line"></i></div>
      <span class="lc-title">ParkSaaS</span>
    </div>
    <p class="lc-sub">欢迎回来，请登录管理员账号</p>
    <el-form :model="lf" :rules="lr" ref="lfRef" @submit.prevent="doLogin">
      <el-form-item label="用户名" prop="user">
        <el-input v-model="lf.user" placeholder="请输入用户名" size="large">
          <template #prefix><i class="ri-user-3-line"></i></template>
        </el-input>
      </el-form-item>
      <el-form-item label="密码" prop="pass">
        <el-input v-model="lf.pass" type="password" show-password placeholder="请输入密码" size="large" @keyup.enter="doLogin">
          <template #prefix><i class="ri-lock-2-line"></i></template>
        </el-input>
      </el-form-item>
      <div class="lc-row">
        <el-checkbox v-model="lf.rem" label="记住我"/>
        <el-link type="primary" :underline="false">忘记密码？</el-link>
      </div>
      <el-button type="primary" size="large" style="width:100%;height:48px;font-size:15px;font-weight:600;border-radius:8px" :loading="lfLoad" native-type="submit">登 录</el-button>
    </el-form>
  </div>
</div>

<!-- ====== APP ====== -->
<el-container v-else style="height:100vh">
  <el-aside width="240px" class="aside">
    <div class="sb-head"><div class="sb-dot"><i class="ri-roadster-line"></i></div><span class="sb-brand">ParkSaaS</span></div>
    <div class="sb-scroll">
      <el-menu :default-active="p" class="sb-menu" @select="p=$event" :unique-opened="true">
        <div class="nav-gt">概览</div>
        <el-menu-item index="dash"><i class="ri-dashboard-3-line"></i>仪表盘</el-menu-item>
        <div class="nav-gt">车场运营</div>
        <el-menu-item index="park"><i class="ri-building-2-line"></i>车场管理</el-menu-item>
        <el-menu-item index="area"><i class="ri-layout-grid-line"></i>区域 / 车位</el-menu-item>
        <el-menu-item index="gate"><i class="ri-door-open-line"></i>出入口管理</el-menu-item>
        <el-menu-item index="dev"><i class="ri-cpu-line"></i>设备管理</el-menu-item>
        <div class="nav-gt">车辆管理</div>
        <el-menu-item index="mon"><i class="ri-coupon-3-line"></i>月卡管理</el-menu-item>
        <el-menu-item index="fix"><i class="ri-map-pin-2-line"></i>固定车位</el-menu-item>
        <el-menu-item index="bw"><i class="ri-shield-check-line"></i>黑白名单</el-menu-item>
        <div class="nav-gt">收费管理</div>
        <el-menu-item index="bill"><i class="ri-money-cny-circle-line"></i>收费规则</el-menu-item>
        <el-menu-item index="order"><i class="ri-file-list-3-line"></i>订单中心</el-menu-item>
        <el-menu-item index="access"><i class="ri-roadster-line"></i>通行记录</el-menu-item>
        <el-menu-item index="excp"><i class="ri-error-warning-line"></i>异常记录</el-menu-item>
        <el-menu-item index="mgate"><i class="ri-lock-unlock-line"></i>手动开闸记录</el-menu-item>
        <div class="nav-gt">数据统计</div>
        <el-menu-item index="rev"><i class="ri-line-chart-line"></i>收入报表</el-menu-item>
        <el-menu-item index="traf"><i class="ri-bar-chart-2-line"></i>车流量统计</el-menu-item>
        <div class="nav-gt">系统设置</div>
        <el-menu-item index="acct"><i class="ri-user-settings-line"></i>账号管理</el-menu-item>
        <el-menu-item index="role"><i class="ri-key-2-line"></i>角色权限</el-menu-item>
        <el-menu-item index="param"><i class="ri-settings-3-line"></i>系统参数</el-menu-item>
        <el-menu-item index="log"><i class="ri-file-text-line"></i>操作日志</el-menu-item>
        <el-menu-item index="remote"><i class="ri-remote-control-line"></i>远程开闸</el-menu-item>
      </el-menu>
    </div>
    <div class="sb-foot">
      <div class="sb-user" @click="logged=false">
        <div class="sb-av">管</div>
        <div><div class="sb-un">管理员</div><div class="sb-ur">超级管理员</div></div>
      </div>
    </div>
  </el-aside>

  <el-container>
    <el-header class="hd" height="64px">
      <el-breadcrumb separator="/"><el-breadcrumb-item>运营管理</el-breadcrumb-item><el-breadcrumb-item><span style="color:var(--text);font-weight:500">{{titles[p]}}</span></el-breadcrumb-item></el-breadcrumb>
      <div class="hd-right">
        <el-tooltip :content="dk?'切换浅色':'切换深色'" placement="bottom"><el-button circle @click="tdk"><i :class="dk?'ri-sun-line':'ri-moon-line'"></i></el-button></el-tooltip>
        <el-badge :value="3" :max="99"><el-button circle @click="ElMessage.info('暂无更多通知')"><i class="ri-notification-3-line"></i></el-button></el-badge>
        <el-dropdown trigger="click">
          <div class="sb-av" style="width:34px;height:34px;font-size:12px;cursor:pointer">管</div>
          <template #dropdown>
            <el-dropdown-menu>
              <el-dropdown-item><i class="ri-user-3-line" style="margin-right:8px"></i>个人信息</el-dropdown-item>
              <el-dropdown-item><i class="ri-settings-3-line" style="margin-right:8px"></i>账号设置</el-dropdown-item>
              <el-dropdown-item divided @click="logged=false"><i class="ri-logout-box-r-line" style="margin-right:8px"></i>退出登录</el-dropdown-item>
            </el-dropdown-menu>
          </template>
        </el-dropdown>
      </div>
    </el-header>

    <el-main class="main-c">

      <!-- DASHBOARD -->
      <template v-if="p==='dash'">
        <div class="pg-hd"><div><h1 class="pg-title">仪表盘</h1><p class="pg-desc">今日数据概览</p></div></div>
        <div class="s4">
          <div class="sc"><div class="si bl"><i class="ri-roadster-line"></i></div><div><div class="sv">347</div><div class="sl">今日在场车辆</div><div class="st up"><i class="ri-arrow-up-s-line"></i>12.5%</div></div></div>
          <div class="sc"><div class="si gn"><i class="ri-wallet-3-line"></i></div><div><div class="sv">¥8,650</div><div class="sl">今日收入</div><div class="st up"><i class="ri-arrow-up-s-line"></i>8.2%</div></div></div>
          <div class="sc"><div class="si am"><i class="ri-map-pin-2-line"></i></div><div><div class="sv">153</div><div class="sl">空闲车位</div><div class="st dn"><i class="ri-arrow-down-s-line"></i>3.1%</div></div></div>
          <div class="sc"><div class="si rd"><i class="ri-error-warning-line"></i></div><div><div class="sv">3</div><div class="sl">今日异常</div><div class="st dn"><i class="ri-arrow-down-s-line"></i>15%</div></div></div>
        </div>
        <div class="cg">
          <el-card shadow="never" class="pc"><template #header><span style="font-weight:600">近7日收入趋势</span></template>
            <div class="bc">
              <div class="col" v-for="d in barData" :key="d.l"><div class="bar bl" :style="{height:d.h+'%'}"></div><span class="lbl">{{d.l}}</span></div>
            </div>
          </el-card>
          <el-card shadow="never" class="pc"><template #header><span style="font-weight:600">车辆类型分布</span></template>
            <div class="donut-w"><div class="donut"></div>
              <div class="leg">
                <span><span class="leg-d" style="background:#2563EB"></span>小型车 35%</span>
                <span><span class="leg-d" style="background:#60A5FA"></span>中型车 20%</span>
                <span><span class="leg-d" style="background:#10B981"></span>大型车 20%</span>
                <span><span class="leg-d" style="background:#F59E0B"></span>新能源 13%</span>
                <span><span class="leg-d" style="background:#94A3B8"></span>其他 12%</span>
              </div>
            </div>
          </el-card>
        </div>
        <el-card shadow="never" class="pc">
          <template #header><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600">最新异常</span><el-button size="small" @click="p='excp'">查看全部</el-button></div></template>
          <el-table :data="excps" stripe size="small">
