# =============================================================================
# 智慧停车 SaaS 平台 — Nginx 站点配置（本地开发环境）
# =============================================================================
# 职责：
#   1. 反向代理 /api/* 到 Spring Boot 后端
#   2. 反向代理 /ws/*（WebSocket）到 Spring Boot 后端
#   3. 反向代理 /actuator/* 到 Spring Boot（健康检查等）
#   4. 后续可服务前端静态资源（/admin/*、/booth/*）
# =============================================================================
# 后端地址说明：
#   host.docker.internal — Docker Desktop (macOS/Windows) 访问宿主机的特殊 DNS
#   Linux 环境下 docker-compose.yml 中已通过 extra_hosts 配置
# =============================================================================

upstream backend {
    # Spring Boot 应用在宿主机 8080 端口运行
    server host.docker.internal:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen       80;
    server_name  localhost;

    # =========================================================================
    # 后端 API 反向代理（FIX-10：统一前后端路径，去除 /api 前缀）
    # =========================================================================
    location /api/ {
        # 重写 URL：去除 /api 前缀后转发到后端
        # 前端请求 /api/auth/login → 后端接收 /auth/login
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend;

        # 请求头
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Trace-Id         $http_x_trace_id;

        # 连接与超时
        proxy_connect_timeout   3s;
        proxy_read_timeout      30s;
        proxy_send_timeout      30s;

        # 缓冲
        proxy_buffering         on;
        proxy_buffer_size       4k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }

    # =========================================================================
    # WebSocket 反向代理（岗亭端实时推送）
    # =========================================================================
    location /ws/ {
        proxy_pass http://backend;

        # WebSocket 必需的 Upgrade 头
        proxy_http_version      1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # WebSocket 长连接超时（1 小时）
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }

    # =========================================================================
    # Actuator 健康检查反向代理
    # =========================================================================
    location /actuator/ {
        proxy_pass http://backend;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_connect_timeout   3s;
        proxy_read_timeout      10s;
    }

    # =========================================================================
    # 前端静态资源 — 总后台管理端（admin-web）
    # =========================================================================
    # 开发阶段：使用 Vite dev server（pnpm dev），不通过 Nginx 服务静态文件。
    # 生产构建：取消下方注释，将 admin-web/dist 挂载到容器内对应路径。
    #
    # location /admin {
    #     alias /usr/share/nginx/html/admin;
    #     try_files $uri $uri/ /admin/index.html;
    #     index index.html;
    # }

    # =========================================================================
    # 前端静态资源 — 岗亭端（booth-web）
    # =========================================================================
    # 同上，开发阶段使用 Vite dev server。
    #
    # location /booth {
    #     alias /usr/share/nginx/html/booth;
    #     try_files $uri $uri/ /booth/index.html;
    #     index index.html;
    # }

    # =========================================================================
    # 默认页面
    # =========================================================================
    location / {
        return 200 "Jushan Smart Parking Platform — Docker Compose Dev Environment
API:       /api/*
WebSocket: /ws/*
Health:    /actuator/health
";
        default_type text/plain;
    }
}
