# =============================================================================
# 智慧停车 SaaS 平台 — Nginx 站点配置（生产环境）
# =============================================================================
# 职责：
#   1. 服务前端静态资源（frontend SPA）
#   2. 反向代理 /api/* 到后端
#   3. 反向代理 /ws/*（WebSocket 长连接）
#   4. 反向代理 /actuator/*（仅内网可访问）
# =============================================================================

upstream backend {
    server backend:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ---- 限流 ----
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name ${NGINX_SERVER_NAME:-_};

    # ---- 安全头 ----
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # =========================================================================
    # 前端 SPA（frontend 统一 Web 应用）
    # =========================================================================
    root /usr/share/nginx/html/booth;

    # 静态资源长期缓存（带 hash 的构建产物）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 非静态资源走 SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # =========================================================================
    # 后端 API 反向代理
    # =========================================================================
    location /api/ {
        limit_req  zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 20;

        # 后端 Controller 自带 /api 前缀，原样转发，不要 rewrite
        proxy_pass http://backend;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_connect_timeout   5s;
        proxy_read_timeout      30s;
        proxy_send_timeout      30s;

        proxy_buffering         on;
        proxy_buffer_size       4k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }

    # =========================================================================
    # 芊熠抓拍图片（方案 B：nginx 直读磁盘 + 上传反代到 device-access）
    # 图片目录与 device-access 共享宿主目录 ./data/device-images
    # =========================================================================
    # 相机上传入口（协议 §7.1.2，alone_url 配置为 /images/upload）
    # device-access 以宿主网络/宿主机部署，经 host.docker.internal 访问
    location = /images/upload {
        proxy_pass http://host.docker.internal:8082/api/v1/images/upload;

        client_max_body_size    20m;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_connect_timeout   5s;
        proxy_read_timeout      30s;
    }

    # 图片静态访问：nginx 直接读磁盘，不经过 device-access
    location /images/ {
        alias /usr/share/nginx/device-images/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # =========================================================================
    # WebSocket 反向代理（岗亭端实时推送）
    # =========================================================================
    location /ws/ {
        proxy_pass http://backend;

        proxy_http_version      1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }

    # =========================================================================
    # Actuator 健康检查（仅内网）
    # =========================================================================
    location /actuator/ {
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://backend;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;

        proxy_connect_timeout   3s;
        proxy_read_timeout      10s;
    }

    # =========================================================================
    # 禁止访问隐藏文件
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

