<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Access — 设备管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }
        .header {
            background: #1a1a2e;
            color: #fff;
            padding: 16px 32px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header .version { font-size: 12px; color: #8892b0; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }

        /* 工具栏 */
        .toolbar {
            display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
        }
        .toolbar input, .toolbar select {
            padding: 8px 14px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px;
            outline: none; transition: border-color .2s;
        }
        .toolbar input:focus, .toolbar select:focus { border-color: #4a6cf7; }
        .toolbar input { width: 240px; }
        .toolbar select { width: 120px; }
        .btn {
            padding: 8px 18px; border: none; border-radius: 6px; font-size: 14px;
            cursor: pointer; font-weight: 500; transition: all .2s;
        }
        .btn-primary { background: #4a6cf7; color: #fff; }
        .btn-primary:hover { background: #3b5de7; }
        .btn-success { background: #10b981; color: #fff; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-ghost { background: #fff; color: #4a6cf7; border: 1px solid #4a6cf7; }
        .btn-ghost:hover { background: #eef1ff; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }

        /* 表格 */
        .table-wrap {
            background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left; padding: 12px 16px; font-size: 12px; color: #888;
            background: #fafafa; border-bottom: 1px solid #f0f0f0; text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #f5f5f5; }
        tr:hover { background: #fafbff; }
        .status {
            display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 500;
        }
        .status-ONLINE { background: #d1fae5; color: #065f46; }
        .status-OFFLINE { background: #f3f4f6; color: #6b7280; }
        .status-UNKNOWN { background: #fef3c7; color: #92400e; }

        /* 弹窗 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            z-index: 100; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff; border-radius: 12px; padding: 28px 32px; width: 440px;
            max-width: 95vw; box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .modal h2 { font-size: 18px; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 4px;
        }
        .form-group label .required { color: #ef4444; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px;
            font-size: 14px; outline: none; font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #4a6cf7; }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 200;
            padding: 10px 24px; border-radius: 8px; font-size: 14px; color: #fff;
            opacity: 0; transition: opacity .3s;
        }
        .toast.show { opacity: 1; }
        .toast-success { background: #10b981; }
        .toast-error { background: #ef4444; }

        .empty { text-align: center; padding: 60px 0; color: #aaa; }
        .empty .icon { font-size: 48px; margin-bottom: 12px; }
        .clickable { color: #4a6cf7; cursor: pointer; }
        .clickable:hover { text-decoration: underline; }
        .text-muted { color: #aaa; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🅿 Device Access — 设备管理</h1>
            <span class="version">v0.2</span>
        </div>
    </div>

    <div class="container">
        <!-- 工具栏 -->
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="🔍 搜索设备ID或名称..." oninput="loadDevices()">
            <select id="brandFilter" onchange="loadDevices()">
                <option value="">全部品牌</option>
                <option value="ZHENSHI">臻识</option>
            </select>
            <select id="statusFilter" onchange="loadDevices()">
                <option value="">全部状态</option>
                <option value="ONLINE">在线</option>
                <option value="OFFLINE">离线</option>
            </select>
            <button class="btn btn-primary" onclick="openRegisterModal()">＋ 注册设备</button>
            <button class="btn btn-ghost" onclick="loadDevices()">🔄 刷新</button>
        </div>

        <!-- 设备表格 -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>设备ID</th>
                        <th>名称</th>
                        <th>品牌</th>
                        <th>型号</th>
                        <th>状态</th>
                        <th>最后在线</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="deviceTableBody">
                    <tr><td colspan="7" class="empty"><div class="icon">📭</div>暂无设备，点击"注册设备"添加第一台</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 注册/编辑弹窗 -->
    <div class="modal-overlay" id="formModal">
        <div class="modal">
            <h2 id="formModalTitle">注册设备</h2>
            <div class="form-group">
                <label><span class="required">*</span> 设备ID（序列号）</label>
                <input type="text" id="formDeviceId" placeholder="例如 b30113ab-a034d147">
            </div>
            <div class="form-group">
                <label><span class="required">*</span> 设备名称</label>
                <input type="text" id="formDeviceName" placeholder="例如 东门入口摄像头">
            </div>
            <div class="form-group">
                <label>品牌</label>
                <input type="text" id="formBrand" placeholder="默认 ZHENSHI">
            </div>
            <div class="form-group">
                <label>型号</label>
                <input type="text" id="formModel" placeholder="默认 C5H">
            </div>
            <div class="form-group">
                <label>状态</label>
                <select id="formStatus">
                    <option value="">不修改</option>
                    <option value="ONLINE">在线</option>
                    <option value="OFFLINE">离线</option>
                </select>
            </div>
            <div class="form-group">
                <label>备注</label>
                <textarea id="formRemark" placeholder="可选"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeFormModal()">取消</button>
                <button class="btn btn-primary" id="formSubmitBtn" onclick="submitForm()">注册</button>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal" style="text-align:center;">
            <div style="font-size:48px;margin-bottom:12px;">⚠️</div>
            <h2>确认注销设备？</h2>
            <p style="color:#888;margin:8px 0;" id="deleteDeviceLabel"></p>
            <p class="text-muted">注销后设备数据将保留在数据库中（软删除），但不会出现在列表里。</p>
            <div class="modal-actions" style="justify-content:center;">
                <button class="btn btn-ghost" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-danger" id="deleteConfirmBtn" onclick="confirmDelete()">确认注销</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const API = '/api/v1/devices';

        let editingDeviceId = null;   // 非空 = 编辑模式
        let deletingDeviceId = null;

        // ── 加载设备列表 ──
        async function loadDevices() {
            const keyword = document.getElementById('searchInput').value.trim();
            const brand = document.getElementById('brandFilter').value;
            const status = document.getElementById('statusFilter').value;

            const params = new URLSearchParams();
            if (keyword) params.set('keyword', keyword);
            if (brand)   params.set('brand', brand);
            if (status)  params.set('status', status);

            try {
                const res = await fetch(API + '?' + params.toString());
                const body = await res.json();
                if (body.code !== 200) { showToast('加载失败: ' + body.message, 'error'); return; }
                renderTable(body.data || []);
            } catch (e) {
                showToast('网络错误，无法加载设备列表', 'error');
            }
        }

        function renderTable(devices) {
            const tbody = document.getElementById('deviceTableBody');
            if (!devices.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty"><div class="icon">📭</div>暂无设备，点击"注册设备"添加第一台</td></tr>';
                return;
            }
            tbody.innerHTML = devices.map(d => `
                <tr>
                    <td><code>${esc(d.deviceId)}</code></td>
                    <td><span class="clickable" onclick="openDetailModal('${esc(d.deviceId)}')">${esc(d.deviceName)}</span></td>
                    <td>${esc(d.brand)}</td>
                    <td>${esc(d.model)}</td>
                    <td><span class="status status-${d.status || 'UNKNOWN'}">${d.status || 'UNKNOWN'}</span></td>
                    <td>${d.lastOnlineTime || '<span class="text-muted">从未在线</span>'}</td>
                    <td>
                        <button class="btn btn-ghost btn-sm" onclick="openEditModal('${esc(d.deviceId)}')">编辑</button>
                        <button class="btn btn-danger btn-sm" onclick="openDeleteModal('${esc(d.deviceId)}','${esc(d.deviceName)}')">注销</button>
                    </td>
                </tr>`).join('');
        }

        // ── 注册弹窗 ──
        function openRegisterModal() {
            editingDeviceId = null;
            document.getElementById('formModalTitle').textContent = '注册设备';
            document.getElementById('formSubmitBtn').textContent = '注册';
            document.getElementById('formDeviceId').disabled = false;
            document.getElementById('formDeviceId').value = '';
            document.getElementById('formDeviceName').value = '';
            document.getElementById('formBrand').value = '';
            document.getElementById('formModel').value = '';
            document.getElementById('formStatus').value = '';
            document.getElementById('formRemark').value = '';
            document.getElementById('formModal').classList.add('active');
        }

        // ── 编辑弹窗 ──
        async function openEditModal(deviceId) {
            try {
                const res = await fetch(API + '/' + deviceId);
                const body = await res.json();
                if (body.code !== 200) { showToast('加载设备详情失败', 'error'); return; }
                const d = body.data;

                editingDeviceId = deviceId;
                document.getElementById('formModalTitle').textContent = '编辑设备';
                document.getElementById('formSubmitBtn').textContent = '保存';
                document.getElementById('formDeviceId').value = d.deviceId;
                document.getElementById('formDeviceId').disabled = true;  // deviceId 不可改
                document.getElementById('formDeviceName').value = d.deviceName || '';
                document.getElementById('formBrand').value = d.brand || '';
                document.getElementById('formModel').value = d.model || '';
                document.getElementById('formStatus').value = d.status || '';
                document.getElementById('formRemark').value = d.remark || '';
                document.getElementById('formModal').classList.add('active');
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        // ── 详情弹窗（复用编辑弹窗，只读） ──
        async function openDetailModal(deviceId) {
            try {
                const res = await fetch(API + '/' + deviceId);
                const body = await res.json();
                if (body.code !== 200) { showToast('加载设备详情失败', 'error'); return; }
                const d = body.data;

                editingDeviceId = null; // 不是编辑模式
                document.getElementById('formModalTitle').textContent = '设备详情';
                document.getElementById('formSubmitBtn').style.display = 'none';  // 隐藏提交按钮
                document.getElementById('formDeviceId').value = d.deviceId;
                document.getElementById('formDeviceId').disabled = true;
                document.getElementById('formDeviceName').value = d.deviceName || '';
                document.getElementById('formDeviceName').disabled = true;
                document.getElementById('formBrand').value = d.brand || '';
                document.getElementById('formBrand').disabled = true;
                document.getElementById('formModel').value = d.model || '';
                document.getElementById('formModel').disabled = true;
                document.getElementById('formStatus').value = d.status || '';
                document.getElementById('formStatus').disabled = true;
                document.getElementById('formRemark').value = d.remark || '';
                document.getElementById('formRemark').disabled = true;
                document.getElementById('formModal').classList.add('active');
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        function closeFormModal() {
            document.getElementById('formModal').classList.remove('active');
            // 恢复所有字段
            document.getElementById('formDeviceId').disabled = false;
            document.getElementById('formDeviceName').disabled = false;
            document.getElementById('formBrand').disabled = false;
            document.getElementById('formModel').disabled = false;
            document.getElementById('formStatus').disabled = false;
            document.getElementById('formRemark').disabled = false;
            document.getElementById('formSubmitBtn').style.display = '';
            editingDeviceId = null;
        }

        async function submitForm() {
            const deviceId = document.getElementById('formDeviceId').value.trim();
            const deviceName = document.getElementById('formDeviceName').value.trim();

            if (!deviceId) { showToast('请填写设备ID', 'error'); return; }
            if (!deviceName) { showToast('请填写设备名称', 'error'); return; }

            const isEdit = !!editingDeviceId;

            const body = { deviceName };

            if (isEdit) {
                // 编辑模式：只传改过的字段
                const brand = document.getElementById('formBrand').value.trim();
                const model = document.getElementById('formModel').value.trim();
                const status = document.getElementById('formStatus').value;
                const remark = document.getElementById('formRemark').value;
                if (brand) body.brand = brand;
                if (model) body.model = model;
                if (status) body.status = status;
                if (remark !== '') body.remark = remark;
            } else {
                // 注册模式
                body.deviceId = deviceId;
                const brand = document.getElementById('formBrand').value.trim();
                const model = document.getElementById('formModel').value.trim();
                const remark = document.getElementById('formRemark').value;
                if (brand) body.brand = brand;
                if (model) body.model = model;
                if (remark) body.remark = remark;
            }

            try {
                const url = isEdit ? API + '/' + editingDeviceId : API;
                const method = isEdit ? 'PUT' : 'POST';
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const result = await res.json();
                if (result.code === 200) {
                    showToast(isEdit ? '设备已更新' : '设备注册成功', 'success');
                    closeFormModal();
                    loadDevices();
                } else {
                    showToast('操作失败: ' + result.message, 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        // ── 删除弹窗 ──
        function openDeleteModal(deviceId, deviceName) {
            deletingDeviceId = deviceId;
            document.getElementById('deleteDeviceLabel').innerHTML =
                '设备 <b>' + esc(deviceId) + '</b>（' + esc(deviceName) + '）';
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            deletingDeviceId = null;
        }

        async function confirmDelete() {
            if (!deletingDeviceId) return;
            try {
                const res = await fetch(API + '/' + deletingDeviceId, { method: 'DELETE' });
                const result = await res.json();
                if (result.code === 200) {
                    showToast('设备已注销', 'success');
                    closeDeleteModal();
                    loadDevices();
                } else {
                    showToast('注销失败: ' + result.message, 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        // ── Toast ──
        function showToast(msg, type) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast toast-' + type + ' show';
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 2500);
        }

        function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        // ── 点击弹窗外部关闭 ──
        document.getElementById('formModal').addEventListener('click', function(e) {
            if (e.target === this) closeFormModal();
        });
        document.getElementById('deleteModal').addEventListener('click', function(e) {
            if (e.target === this) closeDeleteModal();
        });

        // ── 页面加载 ──
        loadDevices();
    </script>
</body>
</html>
